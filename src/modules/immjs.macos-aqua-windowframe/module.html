<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test</title>
	<script src="/.common/setup.js" type="module"></script>
</head>
<body>
    <div id="window_frame">
        <link rel="stylesheet" href="./style.css" />
        <p>
            Hello World
        </p>
    </div>
    <script type="module">
        import { Component, componentList } from "/.common/bundle.js";

        class WindowFrame extends Component {
            $output = document.querySelector("#window_frame").cloneNode(true);
            window;

            constructor(ipc, window) {
                super(ipc);
                this.window = window;
            }

            async init() {
                this.$output.append(await this.window.$output);
            }
        }

        componentList.register("WindowFrame", WindowFrame);
        componentList.markReady();
    </script>
</body>
</html>
