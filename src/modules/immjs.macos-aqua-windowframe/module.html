        .titlebar .dot::after {
            content: '';
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            background-image: url('../x.png');
            background-repeat: no-repeat;
            background-position: center center;
            image-rendering: crisp-edges;
            background-size: contain;
        }


        .dot.close::after {
            content: '';
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0;
            border-radius: 100%;
            position: absolute;
            background: rgb(201, 11, 36);
            mix-blend-mode: overlay;
            z-index: 0;
            box-shadow: 0px 0px 1.5pt black inset;
        }

        .dot.minimize {
            background: #fff7c8;
        }

        .dot.minimize::after {
            content: '';
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0;
            border-radius: 100%;
            position: absolute;
            background: rgb(182, 119, 1);
            mix-blend-mode: overlay;
            z-index: 0;
            box-shadow: 0px 0px 1.5pt black inset;
            filter: saturate(1.5);
        }

        .dot.full {
            background: #def5d5;
        }

        .dot.full::after {
            content: '';
            width: 100%;
            height: 100%;
            top: 0%;
            left: 0;
            border-radius: 100%;
            position: absolute;
            background: rgb(80, 150, 0);
            mix-blend-mode: overlay;
            z-index: 0;
            box-shadow: 0px 0px 1.5pt black inset;
            filter: saturate(1.3);
        }


        .windowbg {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .5em;
            background: repeating-linear-gradient(#E7E7E7, white, #E7E7E7);
            background-size: 100% 6pt;
        }

        .dot {
            width: 1.1em;
            height: 1.1em;
            background-color: white;
            box-shadow: 0px 1pt 1pt #575757 inset, 0px 4pt 3pt #a3a3a3 inset, 0px 1.5pt 1.5pt rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            position: relative;
        }

        .dot:active {
            filter: brightness(.8) contrast(1.3);
        }

        .dot::before {
            content: '';
            width: 55%;
            height: 35%;
            position: absolute;
            top: 27%;
            left: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.7) 40%, rgba(255, 255, 255, 0) 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            filter: blur(0.8pt);
            z-index: 1;
        }
        </style>
        <div id="window" style="box-shadow: 0px .7em 1em rgba(0, 0, 0, 0.6); position: absolute;">
            <div class="titlebar">
                <div class="barbuttons">
                    <div class="dot close"></div>
                    <div class="dot minimize"></div>
                    <div class="dot full"></div>
                </div>Hello World
            </div>
            <div class="windowbg">
            </div>
        </div>
    </div>
    <script type="module">
        import { Component, componentList } from "/.common/bundle.js";

        class WindowFrame extends Component {
            $output = document.querySelector("#window_frame").cloneNode(true);
            window;

            constructor(ipc, window) {
                super(ipc);
                this.window = window;
            }

            async updateGeometry() {
              const geometry = await this.window.$geometry;
              console.log(geometry);
              this.$output.querySelector(".windowbg").style.width = `${geometry.width}px`;
              this.$output.querySelector(".windowbg").style.height = `${geometry.height}px`;
              this.$output.querySelector(".windowbg").style.paddingLeft = `-${geometry.x}px`;
              this.$output.querySelector(".windowbg").style.paddingTop = `-${geometry.y}px`;
            }
            async init() {
                this.$output.querySelector(".windowbg").append(await this.window.$output);

                this.updateGeometry();
                this.window.on("setGeometry", this.updateGeometry.bind(this));
            }
        }

        componentList.register("WindowFrame", WindowFrame);
        componentList.markReady();
    </script>
