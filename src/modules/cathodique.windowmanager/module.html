<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test</title>
	<script src="/.common/setup.js" type="module"></script>
</head>
<body>
    <div id="window_manager">
        <p>Hello World</p>
    </div>
    <script type="module">
        import { Component, componentList, Resolver } from "/.common/bundle.js";

        class WindowManager extends Component {
            $output = document.querySelector("#window_manager").cloneNode(true);

            #windowFrameModule;
            #windowRegistry;
            windowFrames = new Map(); // Window to WindowFrame

            static async create() {
                const windowFrameModule = await Resolver.getDependency("WindowFrame");
                const windowRegistry = await Resolver.summon("Cathodique::Window.WindowRegistry");

                return new WindowManager(windowFrameModule, windowRegistry);
            }

            constructor(windowFrameModule, windowRegistry) {
                super();

                // windowRegistry.$hello();

                this.#windowFrameModule = windowFrameModule;
                this.#windowRegistry = windowRegistry;

                this.#windowRegistry.on("newWindow", this.newWindow.bind(this));
            }
            async newWindow(window) {
                // window is a window component :3
                const WindowFrame = this.#windowFrameModule.get("WindowFrame");
                const windowFrame = await WindowFrame.create(window);
                this.windowFrames.set(window, windowFrame);

                this.$output.append(await windowFrame.$output);
            }
        }
        componentList.register("WindowManager", WindowManager);
        componentList.markReady();
    </script>
</body>
</html>
